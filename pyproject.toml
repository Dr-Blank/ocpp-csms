[project]
name = "ocpp-csms"
version = "0.1.0"
description = "asyncio OCPP 1.6J central system for local control of EV chargers"
authors = [
    { name = "Dr-Blank", email = "64108942+Dr-Blank@users.noreply.github.com" },
]
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = [
    "ocpp",
    "ocpp 1.6",
    "csms",
    "central system",
    "ev charger",
    "evse",
    "home assistant",
    "asyncio",
    "aiohttp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: aiohttp",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.10.0", "ocpp>=2.0.0,<3"]

[project.scripts]
ocpp-csms = "ocpp_csms.__main__:main"

[project.urls]
Homepage = "https://github.com/Dr-Blank/ocpp-csms"
Repository = "https://github.com/Dr-Blank/ocpp-csms"
Issues = "https://github.com/Dr-Blank/ocpp-csms/issues"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pylint>=3.3.7",
    "prek>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocpp_csms"]

[tool.hatch.build.targets.sdist]
include = ["src/ocpp_csms", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "RUF",  # ruff specific
    "ASYNC",
]
ignore = [
    # Prose in docstrings and comments is not wrapped. The formatter still keeps
    # code within line-length; long sentences are left alone deliberately.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["src/ocpp_csms", "tests"]

[[tool.mypy.overrides]]
# The ocpp package ships no type information.
module = ["ocpp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/ocpp_csms"]

[tool.pylint.messages_control]
disable = [
    "line-too-long",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "duplicate-code",
]

[tool.pylint.design]
# ChargePoint is one method per OCPP request plus its state accessors, so the
# count tracks the protocol's surface rather than the class doing too much.
max-public-methods = 30
